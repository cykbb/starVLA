run_id: padtpi_libero_vla_pw_only
run_root_dir: /home/users/astar/i2r/lishijie/grasping_challenge/scratch/results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: bykkk-nanyang-technological-university-singapore
wandb_project: starVLA_Libero
is_debug: false


framework:
  name: PaDTPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/PaDT_Pro_3B
    attn_implementation: flash_attention_2
    spatial_merge_size: 1
    max_vrt_patches: 512
    images_per_sample: 2
    min_required_vrt_patches: 512
    strict_vrt_init: true
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024     # TODO merge with hidden_size, in config v2
    hidden_size: 1024     
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    action_horizon: 8 # need merge with future_action_window_size 
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:    # DiT Transformers 的参数
      cross_attention_dim: 2048 # VLM 的 dim
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  reduce_in_full_precision: true


datasets:
  # 只保留 vla_data，移除 vlm_data 部分
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_goal # libero_goal
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    image_size: 224
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 32
    dataloader_num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av
    include_segmentation: true
    include_answers: true
    include_state: false


trainer:
  debug_vrt: true
  debug_vrt_max_steps: 20
  debug_vrt_token_preview: 12
  debug_vrt_visualize: true
  debug_vrt_visualize_max_samples: 2
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    padt_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # Freeze PaDT VLM vision encoder
  freeze_modules: 'padt_vl_interface.model.model.visual'
  loss_scale:
    vlm: 0.5
  compute_vlm_loss: true
  detach_action_features: false   # action loss 不回传梯度到 VLM，避免梯度冲突
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  # parameters to be determined
  is_resume: true
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
